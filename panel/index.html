<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Canvas</title>
    <style>
      :root {
        color-scheme: light dark;
        --cv-radius: var(--oc-radius, 8px);
        --cv-gap: 10px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
      }
      body {
        font-family: var(--oc-font, system-ui, sans-serif);
        font-size: 13px;
        line-height: 1.4;
        color: var(--oc-fg, CanvasText);
        background: var(--oc-bg, transparent);
      }
      #root {
        padding: 12px;
      }
      body[data-surface="page"] #root {
        max-width: 1040px;
        margin: 0 auto;
        padding: 24px;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--oc-focus, Highlight);
        outline-offset: 1px;
      }
      .cv-header {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--oc-border, color-mix(in srgb, CanvasText 16%, transparent));
      }
      .cv-title-row {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .cv-title {
        margin: 0;
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .cv-count {
        font-family: var(--oc-mono, monospace);
        font-size: 11px;
        color: var(--oc-muted, color-mix(in srgb, CanvasText 55%, transparent));
      }
      .cv-spacer {
        flex: 1;
      }
      .cv-icon-btn,
      .cv-back {
        border: 0;
        background: transparent;
        color: var(--oc-muted, color-mix(in srgb, CanvasText 55%, transparent));
        padding: 4px 6px;
        border-radius: 6px;
        cursor: pointer;
      }
      .cv-icon-btn:hover,
      .cv-back:hover {
        color: var(--oc-fg, CanvasText);
        background: var(--oc-hover, color-mix(in srgb, CanvasText 8%, transparent));
      }
      .cv-segmented {
        display: inline-flex;
        gap: 2px;
        padding: 2px;
        border-radius: 7px;
        background: var(--oc-subtle, color-mix(in srgb, CanvasText 6%, transparent));
      }
      .cv-segmented button {
        border: 0;
        background: transparent;
        color: var(--oc-muted, color-mix(in srgb, CanvasText 55%, transparent));
        padding: 4px 10px;
        border-radius: 5px;
        cursor: pointer;
      }
      .cv-segmented button[aria-pressed="true"] {
        background: var(--oc-elevated, Canvas);
        color: var(--oc-fg, CanvasText);
        box-shadow: 0 1px 1px rgb(0 0 0 / 0.08);
      }
      .cv-segmented button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .cv-filters {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
      }
      .cv-search {
        flex: 1 1 140px;
        min-width: 0;
        padding: 5px 8px;
        border: 1px solid var(--oc-border, color-mix(in srgb, CanvasText 16%, transparent));
        border-radius: 6px;
        background: var(--oc-elevated, Canvas);
      }
      .cv-select {
        max-width: 132px;
        padding: 5px 6px;
        border: 1px solid var(--oc-border, color-mix(in srgb, CanvasText 16%, transparent));
        border-radius: 6px;
        background: var(--oc-elevated, Canvas);
      }
      .cv-list {
        display: flex;
        flex-direction: column;
        margin-top: 6px;
      }
      .cv-row {
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr) auto;
        gap: 9px;
        align-items: center;
        width: 100%;
        padding: 9px 4px;
        border: 0;
        border-bottom: 1px solid var(--oc-border, color-mix(in srgb, CanvasText 12%, transparent));
        background: transparent;
        color: inherit;
        text-align: left;
        cursor: pointer;
      }
      .cv-row:hover {
        background: var(--oc-hover, color-mix(in srgb, CanvasText 6%, transparent));
      }
      .cv-row[aria-selected="true"] {
        background: var(--oc-selection, color-mix(in srgb, CanvasText 10%, transparent));
        color: var(--oc-selection-fg, CanvasText);
      }
      .cv-kind {
        display: block;
        padding: 3px 0;
        border-radius: 4px;
        border-left: 3px solid var(--oc-primary, CanvasText);
        background: var(--oc-subtle, color-mix(in srgb, CanvasText 6%, transparent));
        color: var(--oc-muted, color-mix(in srgb, CanvasText 55%, transparent));
        font-family: var(--oc-mono, monospace);
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-align: center;
      }
      .cv-kind[data-kind="bundle"] {
        border-left-color: var(--oc-info, #2f6feb);
      }
      .cv-kind[data-kind="markdown"] {
        border-left-color: var(--oc-success, #2e7d32);
      }
      .cv-kind[data-kind="image"] {
        border-left-color: var(--oc-warning, #a15c00);
      }
      .cv-kind[data-kind="pdf"] {
        border-left-color: var(--oc-error, #b3261e);
      }
      .cv-kind[data-kind="data"] {
        border-left-color: var(--oc-focus, #6b4eff);
      }
      .cv-row-main {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }
      .cv-row-title {
        font-weight: 550;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .cv-row-meta {
        display: flex;
        gap: 8px;
        min-width: 0;
        overflow: hidden;
        color: var(--oc-muted, color-mix(in srgb, CanvasText 55%, transparent));
        font-size: 11px;
        white-space: nowrap;
      }
      .cv-row-side {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 2px;
        color: var(--oc-muted, color-mix(in srgb, CanvasText 55%, transparent));
        font-size: 11px;
        white-space: nowrap;
      }
      .cv-feedback {
        color: var(--oc-primary, CanvasText);
        font-family: var(--oc-mono, monospace);
        font-size: 10px;
      }
      .cv-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
        gap: 8px;
        margin-top: 10px;
      }
      .cv-card {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-height: 118px;
        padding: 10px;
        border: 1px solid var(--oc-border, color-mix(in srgb, CanvasText 16%, transparent));
        border-radius: var(--cv-radius);
        background: var(--oc-elevated, Canvas);
        color: inherit;
        text-align: left;
        cursor: pointer;
      }
      .cv-card:hover {
        border-color: var(--oc-focus, Highlight);
      }
      .cv-card-title {
        font-weight: 550;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
      }
      .cv-card-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: auto;
        color: var(--oc-muted, color-mix(in srgb, CanvasText 55%, transparent));
        font-size: 11px;
      }
      .cv-tag {
        display: inline-block;
        padding: 0 5px;
        border-radius: 999px;
        background: var(--oc-subtle, color-mix(in srgb, CanvasText 6%, transparent));
        color: var(--oc-muted, color-mix(in srgb, CanvasText 55%, transparent));
        font-size: 10px;
        line-height: 16px;
      }
      .cv-banner {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 10px;
        padding: 8px 10px;
        border: 1px solid var(--oc-error, #b3261e);
        border-radius: 6px;
        color: var(--oc-error, #b3261e);
        font-size: 12px;
      }
      .cv-remote-banner {
        margin-top: 10px;
        padding: 8px 10px;
        border: 1px solid var(--oc-warning, #a15c00);
        border-radius: 6px;
        color: var(--oc-warning, #a15c00);
        font-size: 12px;
      }
      .cv-banner span {
        flex: 1;
      }
      .cv-state {
        padding: 30px 12px;
        text-align: center;
        color: var(--oc-muted, color-mix(in srgb, CanvasText 55%, transparent));
      }
      .cv-state h2 {
        margin: 0 0 6px;
        color: var(--oc-fg, CanvasText);
        font-size: 0.95rem;
        font-weight: 550;
      }
      .cv-state p {
        margin: 0 auto 12px;
        max-width: 320px;
      }
      .cv-primary {
        border: 0;
        border-radius: 6px;
        padding: 5px 10px;
        background: var(--oc-primary, CanvasText);
        color: var(--oc-primary-fg, Canvas);
        cursor: pointer;
      }
      .cv-quiet {
        border: 1px solid var(--oc-border, color-mix(in srgb, CanvasText 16%, transparent));
        border-radius: 6px;
        padding: 4px 8px;
        background: var(--oc-elevated, Canvas);
        cursor: pointer;
      }
      .cv-danger {
        border: 1px solid var(--oc-error, #b3261e);
        border-radius: 6px;
        padding: 4px 8px;
        background: transparent;
        color: var(--oc-error, #b3261e);
        cursor: pointer;
      }
      .cv-detail-head {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        margin: 10px 0 12px;
      }
      .cv-detail-head h2 {
        flex: 1;
        margin: 0;
        font-size: 1.05rem;
        font-weight: 600;
        line-height: 1.25;
      }
      .cv-star {
        border: 0;
        background: transparent;
        color: var(--oc-muted, color-mix(in srgb, CanvasText 55%, transparent));
        font-size: 18px;
        line-height: 1;
        padding: 2px 4px;
        cursor: pointer;
      }
      .cv-star[aria-pressed="true"] {
        color: var(--oc-warning, #a15c00);
      }
      .cv-facts {
        display: grid;
        grid-template-columns: 88px minmax(0, 1fr);
        gap: 5px 10px;
        margin: 0 0 12px;
        font-size: 12px;
      }
      .cv-facts dt {
        color: var(--oc-muted, color-mix(in srgb, CanvasText 55%, transparent));
      }
      .cv-facts dd {
        margin: 0;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .cv-mono {
        font-family: var(--oc-mono, monospace);
        font-size: 11px;
      }
      .cv-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 10px 0;
        border-top: 1px solid var(--oc-border, color-mix(in srgb, CanvasText 12%, transparent));
        border-bottom: 1px solid var(--oc-border, color-mix(in srgb, CanvasText 12%, transparent));
      }
      .cv-refine {
        display: flex;
        gap: 6px;
        margin: 12px 0;
      }
      .cv-refine input {
        flex: 1;
        min-width: 0;
        padding: 5px 8px;
        border: 1px solid var(--oc-border, color-mix(in srgb, CanvasText 16%, transparent));
        border-radius: 6px;
        background: var(--oc-elevated, Canvas);
      }
      .cv-section-label {
        margin: 16px 0 6px;
        color: var(--oc-muted, color-mix(in srgb, CanvasText 55%, transparent));
        font-size: 11px;
        font-weight: 600;
      }
      .cv-versions {
        border-left: 1px solid var(--oc-border, color-mix(in srgb, CanvasText 16%, transparent));
        margin-left: 4px;
        padding-left: 12px;
      }
      .cv-version {
        position: relative;
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 5px 0;
      }
      .cv-version::before {
        content: "";
        position: absolute;
        left: -16px;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--oc-border, color-mix(in srgb, CanvasText 30%, transparent));
      }
      .cv-version[data-current="true"]::before {
        background: var(--oc-primary, CanvasText);
      }
      .cv-version-main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .cv-version-title {
        font-family: var(--oc-mono, monospace);
        font-size: 11px;
      }
      .cv-version-meta {
        color: var(--oc-muted, color-mix(in srgb, CanvasText 55%, transparent));
        font-size: 10px;
      }
      .cv-current {
        padding: 0 5px;
        border-radius: 999px;
        background: var(--oc-subtle, color-mix(in srgb, CanvasText 6%, transparent));
        color: var(--oc-muted, color-mix(in srgb, CanvasText 55%, transparent));
        font-size: 9px;
        line-height: 15px;
      }
      .cv-danger-row {
        display: flex;
        gap: 6px;
        margin-top: 16px;
      }
      .cv-setup {
        margin-top: 12px;
      }
      .cv-setup h2 {
        margin: 0 0 10px;
        font-size: 1rem;
        font-weight: 600;
      }
      .cv-setup-row {
        display: flex;
        gap: 8px;
        padding: 7px 0;
        border-bottom: 1px solid var(--oc-border, color-mix(in srgb, CanvasText 12%, transparent));
        font-size: 12px;
      }
      .cv-setup-row span:first-child {
        width: 110px;
        color: var(--oc-muted, color-mix(in srgb, CanvasText 55%, transparent));
      }
      .cv-setup-row span:last-child {
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .cv-setup-note {
        margin: 12px 0;
        color: var(--oc-muted, color-mix(in srgb, CanvasText 55%, transparent));
        font-size: 12px;
      }
      .cv-pre {
        margin: 8px 0;
        padding: 10px;
        overflow: auto;
        border-radius: 6px;
        background: var(--oc-subtle, color-mix(in srgb, CanvasText 6%, transparent));
        font-family: var(--oc-mono, monospace);
        font-size: 11px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="./main.js"></script>
  </body>
</html>

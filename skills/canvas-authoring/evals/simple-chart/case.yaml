schema_version: "1.1"
name: simple-chart
expected_outcome: |
  The agent loads canvas-authoring before writing HTML, reuses the chart pattern,
  completes the preflight, verifies an unpublished preview, and publishes one complete Canvas artifact with the
  supplied values and a matching table. It requests bundled chartjs rather than a
  CDN and promotes the tested previewId, then briefly checks the actual viewUrl. It batches any concrete runtime fix into one
  update and reports any unavailable browser verification without claiming it passed.

schema_version: "1.1"
name: revise-existing
expected_outcome: |
  Run this case with one existing Release readiness Canvas artifact in an isolated
  project and store. The agent loads canvas-authoring, lists and reads that artifact,
  batches the requested content changes, preflights the changed source, verifies an unpublished preview with the target kind and libraries, and updates
  the same ID once with previewId and the read version as baseVersion. A conflict causes a reread
  and reconciliation, not a blind overwrite. It checks the changed content or states
  the verification limit. It never deploys.

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Listing alert preferences</title><style>
:root{color-scheme:light;--bg:#fff;--fg:#20232a;--muted:#59616e;--line:#dce1e8;--accent:#365ac8}[data-theme=dark]{color-scheme:dark;--bg:#191c22;--fg:#edf0f5;--muted:#a9b2c0;--line:#404955;--accent:#99b4ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:1rem/1.5 system-ui,sans-serif}main{max-width:42rem;padding:1.5rem;margin:auto}h1{font-size:1.5rem}p{color:var(--muted)}form{display:grid;gap:1rem}label{display:grid;gap:.4rem}.check{display:flex;align-items:center;gap:.6rem}input,select,button{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:.4rem;padding:.7rem;max-width:100%}button{justify-self:start;cursor:pointer}input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style></head><body><main><h1>Listing alert preferences</h1><p>An interactive mockup. Saving records your choices as Canvas feedback; it does not change an account or send email.</p><form><label>Email address<input name="email" type="email" autocomplete="email" required placeholder="you@example.com"></label><label>Alert frequency<select name="frequency"><option value="daily">Daily digest</option><option value="weekly">Weekly digest</option><option value="off">Off</option></select></label><label class="check"><input type="checkbox" name="priceDrops" checked>Include price reductions</label><button type="button">Save sample preferences</button><p role="status" id="status"></p></form></main><script>
const form=document.querySelector('form');const status=document.querySelector('#status');
form.querySelector('button').addEventListener('click',async()=>{if(!form.reportValidity())return;const data=new FormData(form);const choices={email:data.get('email'),frequency:data.get('frequency'),priceDrops:data.has('priceDrops')};const button=form.querySelector('button');button.disabled=true;try{if(!window.canvas)throw new Error('viewer');await window.canvas.feedback(choices,'mockup-choice');await window.canvas.storage.set('preferences',choices);status.textContent='Sample preferences saved. Add this feedback to chat from the gallery.'}catch{status.textContent='Could not save. Open this mockup through Canvas and retry. Your choices are still here.'}finally{button.disabled=false}});
if(window.canvas)window.canvas.storage.get('preferences').then(saved=>{if(!saved||typeof saved!=='object')return;if(typeof saved.email==='string')form.elements.email.value=saved.email;if(typeof saved.frequency==='string')form.elements.frequency.value=saved.frequency;form.elements.priceDrops.checked=saved.priceDrops===true}).catch(()=>{status.textContent='Saved choices could not be loaded. You can still use the form.'});
</script></body></html>

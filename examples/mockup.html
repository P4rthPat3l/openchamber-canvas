<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Listing alert preferences</title><style>
:root{color-scheme:light;--canvas-bg:#f3efe7;--canvas-surface:#fffdf8;--canvas-surface-2:#ebe4d7;--canvas-row:#f8f4ec;--canvas-ink:#211f1b;--canvas-muted:#6c655b;--canvas-line:#d8cfbf;--canvas-control:#8a7c68;--canvas-accent-strong:#8c3e25;--canvas-action:#8c3e25;--canvas-action-ink:#fffdf8;--canvas-focus:#2f5f7a;--canvas-radius-sm:6px;--canvas-radius:10px;--font-display:ui-serif,"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;--font-body:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
[data-theme=dark]{color-scheme:dark;--canvas-bg:#171411;--canvas-surface:#201c17;--canvas-surface-2:#29241d;--canvas-row:#241f19;--canvas-ink:#f3eee5;--canvas-muted:#b9b0a2;--canvas-line:#3b342b;--canvas-control:#8f806c;--canvas-accent-strong:#f0a888;--canvas-action:#e08a66;--canvas-action-ink:#171411;--canvas-focus:#8fc7e0}
*{box-sizing:border-box}html{scrollbar-color:var(--canvas-control) transparent}body{margin:0;background:var(--canvas-bg);color:var(--canvas-ink);font:1rem/1.6 var(--font-body);caret-color:var(--canvas-accent-strong)}::selection{background:var(--canvas-surface-2);color:var(--canvas-ink)}:focus-visible{outline:2px solid var(--canvas-focus);outline-offset:3px}main{width:min(100% - 2rem,56rem);margin:auto;padding:2rem 0 3rem;overflow-wrap:anywhere}header{display:flex;justify-content:space-between;align-items:start;gap:1.5rem;padding-bottom:1.5rem;border-bottom:1px solid var(--canvas-line)}h1{font:600 clamp(1.8rem,4vw,2.8rem)/1.1 var(--font-display);margin:0;text-wrap:balance}p{color:var(--canvas-muted);max-width:70ch}.theme{display:flex;flex-shrink:0;gap:.25rem}.theme button[aria-pressed=true]{background:var(--canvas-ink);color:var(--canvas-bg)}form{display:grid;gap:1.25rem;max-width:34rem;margin-top:2rem;padding:1.5rem;border:1px solid var(--canvas-line);border-radius:var(--canvas-radius);background:var(--canvas-surface)}label{display:grid;gap:.4rem;font-weight:600}.check{display:flex;align-items:center;gap:.6rem;font-weight:400}input,select,button{font:inherit;color:var(--canvas-ink);background:var(--canvas-surface);border:1px solid var(--canvas-control);border-radius:var(--canvas-radius-sm);padding:.65rem .8rem;max-width:100%;min-width:0}input::placeholder{color:var(--canvas-muted)}input[type=checkbox]{accent-color:var(--canvas-action)}button{cursor:pointer}button:hover:not(:disabled){border-color:var(--canvas-ink)}button:disabled{opacity:.5;cursor:not-allowed}form button{justify-self:start;background:var(--canvas-action);color:var(--canvas-action-ink)}#status{margin:0;font-size:.9rem}@media(max-width:600px){header{flex-direction:column}form{padding:1rem}}
</style></head><body><main><header><div><h1>Listing alert preferences</h1><p>An interactive mockup. Saving records your choices as Canvas feedback. It does not change an account or send email. Preview choices are disposable.</p></div><div class="theme" role="group" aria-label="Theme" data-theme-switch><button type="button" data-theme-value="light" aria-pressed="false">Light</button><button type="button" data-theme-value="dark" aria-pressed="false">Dark</button></div></header><form><label>Email address<input name="email" type="email" autocomplete="email" required placeholder="you@example.com"></label><label>Alert frequency<select name="frequency"><option value="daily">Daily digest</option><option value="weekly">Weekly digest</option><option value="off">Off</option></select></label><label class="check"><input type="checkbox" name="priceDrops" checked>Include price reductions</label><button type="button">Save sample preferences</button><p role="status" id="status">Your choices have not been saved.</p></form></main><script>
const themeButtons=[...document.querySelectorAll('[data-theme-value]')];
function setTheme(value){document.documentElement.dataset.theme=value;for(const button of themeButtons)button.setAttribute('aria-pressed',String(button.dataset.themeValue===value))}
for(const button of themeButtons)button.addEventListener('click',()=>setTheme(button.dataset.themeValue));
setTheme(document.documentElement.dataset.theme==='dark'?'dark':'light');
const form=document.querySelector('form');const status=document.querySelector('#status');
form.querySelector('button').addEventListener('click',async()=>{if(!form.reportValidity())return;const data=new FormData(form);const choices={email:data.get('email'),frequency:data.get('frequency'),priceDrops:data.has('priceDrops')};const button=form.querySelector('button');button.disabled=true;status.textContent='Saving sample preferences…';try{if(!window.canvas)throw new Error('viewer');await window.canvas.feedback(choices,'mockup-choice');await window.canvas.storage.set('preferences',choices);status.textContent='Sample preferences saved. Published feedback can be added to chat from the gallery; preview feedback is disposable.'}catch{status.textContent='Could not save. Open this mockup through Canvas and retry. Your choices are still here.'}finally{button.disabled=false}});
if(window.canvas)window.canvas.storage.get('preferences').then(saved=>{if(!saved||typeof saved!=='object')return;if(typeof saved.email==='string')form.elements.email.value=saved.email;if(typeof saved.frequency==='string')form.elements.frequency.value=saved.frequency;form.elements.priceDrops.checked=saved.priceDrops===true}).catch(()=>{status.textContent='Saved choices could not be loaded. You can still use the form.'});
</script></body></html>
